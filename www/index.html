<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>自然拼读记单词一本通 · 视频讲解</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#eef4fb; min-height:100vh; }
  .hide { display:none !important; }

  /* ---------- 列表页 ---------- */
  header { position:sticky; top:0; z-index:10; background:linear-gradient(135deg,#4a90e2,#5aa8f0); color:#fff; padding:14px 16px; box-shadow:0 2px 8px rgba(74,144,226,.3); }
  header h1 { font-size:17px; font-weight:600; }
  header p { font-size:12px; opacity:.85; margin-top:2px; }
  main { max-width:640px; margin:0 auto; padding:12px 12px 40px; }
  .chapter { background:#fff; border-radius:14px; margin-bottom:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .chapter-title { display:flex; align-items:center; gap:8px; padding:14px 16px; font-size:15px; font-weight:600; color:#333; cursor:pointer; user-select:none; }
  .chapter-title .dot { width:10px; height:10px; border-radius:50%; background:#f5a623; flex:none; }
  .chapter-title .arrow { margin-left:auto; color:#bbb; font-size:12px; transition:transform .2s; }
  .chapter.open .arrow { transform:rotate(180deg); }
  .items { display:none; border-top:1px solid #f0f0f0; }
  .chapter.open .items { display:block; }
  .item { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid #f5f7fa; cursor:pointer; }
  .item:last-child { border-bottom:none; }
  .item:active { background:#f2f8ff; }
  .item .icon { width:30px; height:30px; border-radius:8px; background:#e8f1fd; color:#4a90e2; display:flex; align-items:center; justify-content:center; flex:none; }
  .item .label { font-size:15px; color:#333; line-height:1.45; }
  .item .play { margin-left:auto; color:#ccc; font-size:14px; flex:none; }

  /* ---------- 播放页 ---------- */
  #player { position:fixed; inset:0; background:#fff; z-index:100; display:flex; flex-direction:column; }
  #player .bar { display:flex; align-items:center; gap:10px; padding:12px 14px; background:linear-gradient(135deg,#4a90e2,#5aa8f0); color:#fff; flex:none; }
  #player .back { width:32px; height:32px; border:none; border-radius:50%; background:rgba(255,255,255,.2); color:#fff; font-size:18px; cursor:pointer; flex:none; }
  #player .title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #player .vwrap { flex:1; background:#000; display:flex; align-items:center; justify-content:center; }
  #video { width:100%; max-height:100%; }
  #player .tip { flex:none; text-align:center; color:#999; font-size:12px; padding:10px; }
  #player .nav { flex:none; display:flex; border-top:1px solid #eee; }
  #player .nav button { flex:1; padding:14px; border:none; background:#fff; font-size:15px; color:#4a90e2; cursor:pointer; }
  #player .nav button:disabled { color:#ccc; }
  #player .nav button + button { border-left:1px solid #eee; }
</style>
</head>
<body>

<div id="list">
  <header>
    <h1>自然拼读记单词一本通</h1>
    <p>点击任意字母 / 组合，自动播放对应视频讲解</p>
  </header>
  <main id="chapters"></main>
</div>

<div id="player" class="hide">
  <div class="bar">
    <button class="back" onclick="goBack()">‹</button>
    <div class="title" id="pTitle"></div>
  </div>
  <div class="vwrap"><video id="video" controls playsinline webkit-playsinline preload="metadata"></video></div>
  <div class="tip">视频来源：伴学堂 CDN · 仅供个人学习使用</div>
  <div class="nav">
    <button id="prevBtn" onclick="step(-1)">← 上一个</button>
    <button id="nextBtn" onclick="step(1)">下一个 →</button>
  </div>
</div>

<script src="data.js"></script>
<script>
const flat = [];
DATA.forEach((ch, ci) => ch.items.forEach((it, ii) => flat.push({ ...it, ci, ii })));

function renderList() {
  const root = document.getElementById('chapters');
  DATA.forEach((ch, ci) => {
    const sec = document.createElement('div');
    sec.className = 'chapter open';
    sec.innerHTML = `<div class="chapter-title" onclick="this.parentNode.classList.toggle('open')">
        <span class="dot"></span>${ch.name}<span class="arrow">▼</span></div>
      <div class="items"></div>`;
    const box = sec.querySelector('.items');
    ch.items.forEach((it, ii) => {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = `<div class="icon">▶</div><div class="label">${it.name}</div><div class="play">›</div>`;
      d.onclick = () => play(ci, ii);
      box.appendChild(d);
    });
    root.appendChild(sec);
  });
}

let cur = -1;
function play(ci, ii) {
  const it = DATA[ci].items[ii];
  cur = flat.findIndex(x => x.ci === ci && x.ii === ii);
  document.getElementById('list').classList.add('hide');
  document.getElementById('player').classList.remove('hide');
  document.getElementById('pTitle').textContent = it.name;
  const v = document.getElementById('video');
  v.poster = '';
  v.src = it.mp4;
  v.play().catch(() => {});
  document.getElementById('prevBtn').disabled = cur <= 0;
  document.getElementById('nextBtn').disabled = cur >= flat.length - 1;
  history.replaceState(null, '', '#' + it.id);
}
function goBack() {
  document.getElementById('player').classList.add('hide');
  document.getElementById('list').classList.remove('hide');
  document.getElementById('video').pause();
  history.replaceState(null, '', ' ');
}
function step(d) { const t = flat[cur + d]; if (t) play(t.ci, t.ii); }

// 支持 #id 直达某个视频（刷新/分享链接后仍定位）
document.addEventListener('keydown', e => {
  if (document.getElementById('player').classList.contains('hide')) return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'Escape') goBack();
});
renderList();
const hash = location.hash.slice(1);
if (hash) {
  const idx = flat.findIndex(x => String(x.id) === hash);
  if (idx >= 0) play(flat[idx].ci, flat[idx].ii);
}
</script>
</body>
</html>
